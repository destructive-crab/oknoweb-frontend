<ng-template #buttonNGTemplate>
  <ng-content></ng-content>
</ng-template>

@if (this.link != '') {
  <a href="{{ this.link }}" target="{{ this.target }}">
    <button [ngClass]="classes">
      <ng-container *ngTemplateOutlet="buttonNGTemplate" />
    </button>
  </a>
} @else if (this.routeLink != '') {
  <button [ngClass]="classes" (click)="handleClick($event)">
    <ng-container *ngTemplateOutlet="buttonNGTemplate" />
  </button>
} @else {
  <button [ngClass]="classes" (click)="handleClick($event)">
    <ng-container *ngTemplateOutlet="buttonNGTemplate" />
  </button>
}
