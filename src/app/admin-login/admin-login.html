<div class="flex justify-center items-center w-full min-h-screen">
  <app-block>
    <div class="w-full flex flex-col items-center p-6 md:py-14">
      <img src="okno_submit.png" alt="OKNO*ADMIN" class="h-24 md:h-40 object-contain object-center mb-6" />
      <h2 class="font-main text-4xl md:text-5xl 3xl:text-6xl text-[#000555] text-center mb-6">OKNO ADMIN LOGIN</h2>
      <form (ngSubmit)="login()" class="flex flex-col gap-4 w-full max-w-md mx-auto">
        <input
          class="bg-white text-blue-700 font-main text-2xl md:text-3xl text-center border-5 border-blue-700 focus:outline-blue-400 w-full rounded mb-2"
          [(ngModel)]="username"
          name="username"
          type="text"
          placeholder="Логин"
          required
        />
        <input
          class="bg-white text-blue-700 font-main text-2xl md:text-3xl text-center border-5 border-blue-700 focus:outline-blue-400 w-full rounded mb-2"
          [(ngModel)]="password"
          name="password"
          type="password"
          placeholder="Пароль"
          required
        />
        <button type="submit" class="bg-blue-700 hover:bg-blue-800 active:bg-blue-900 text-white items-center font-main text-3xl md:text-4xl hover:cursor-pointer w-full py-2.5 rounded">
          <b>Войти</b>
        </button>
        <div *ngIf="loginFailed" class="text-red-700 text-lg text-center font-main mt-1">Invalid username or password</div>
      </form>
    </div>
  </app-block>
</div>
