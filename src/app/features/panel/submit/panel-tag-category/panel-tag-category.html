@if (!editMode)
{
  <hr>
  <div class="grid grid-cols-2">
    <div class="w-full text-center">
      {{categorySignal().category}} ({{categorySignal().order}}, Panel Only: {{categorySignal().panelOnly}})
    </div>
    <app-button preset="full t0 bluealt2" (click)="edit()"> Edit </app-button>
  </div>
  <hr>
}
@else {
  <div class="w-full text-center">
    Редактирование {{categorySignal().category}} ({{categorySignal().order}})
  </div>
  <input
    id="categoryEdited"
    type="text"
    [formControl]="categoryEdited"
    [maxLength]="60"
    placeholder="категория"
    class="bg-white text-blue-700 font-main text-2xl md:text-[2vw] text-center border-4 3xl:border-8 border-pink-400 focus:ring-0 focus:outline-2 focus:outline-pink-400 font-bold w-full mb-2 3xl:mb-8"
  />

  Panel Only <input type="checkbox" [(ngModel)]="panelOnly" />

  <input
    id="orderEdited"
    type="text"
    [formControl]="orderEdited"
    [maxLength]="60"
    placeholder="order"
    class="bg-white text-blue-700 font-main text-2xl md:text-[2vw] text-center border-4 3xl:border-8 border-pink-400 focus:ring-0 focus:outline-2 focus:outline-pink-400 font-bold w-full mb-2 3xl:mb-8"
  />

  <div class="w-full grid grid-cols-3 gap-x-2">
    <app-button preset = "full bluealt2 t0" (click)="saveChanges()"> <b> save</b></app-button>
    <app-button preset = "full bluealt2 t0" (click)="discardChanges()"> <b> discard</b></app-button>
    <app-button preset = "full red t0" (click)="delete()"> <b> delete</b></app-button>
  </div>
  <br>
}
