  @if (creationMenuOpened) {
    <h2 class="text-3xl text-center"> новая категория </h2>
    <input
      id="author"
      type="text"
      [formControl]="author"
      [maxLength]="60"
      placeholder="автор"
      class="bg-white text-blue-700 font-main text-2xl md:text-[2vw] text-center border-4 3xl:border-8 border-pink-400 focus:ring-0 focus:outline-2 focus:outline-pink-400 font-bold w-full mb-2 3xl:mb-8"
    />

    <input
      id="link"
      type="text"
      [formControl]="link"
      [maxLength]="100"
      placeholder="ссылка"
      class="bg-white text-blue-700 font-main text-2xl md:text-[2vw] text-center border-4 3xl:border-8 border-pink-400 focus:ring-0 focus:outline-2 focus:outline-pink-400 font-bold w-full mb-2 3xl:mb-8"
    />

    <input
      id="rating"
      type="number"
      [formControl]="rating"
      [maxLength]="2"
      placeholder="оценка"
      class="bg-white text-blue-700 font-main text-2xl md:text-[2vw] text-center border-4 3xl:border-8 border-pink-400 focus:ring-0 focus:outline-2 focus:outline-pink-400 font-bold w-full mb-2 3xl:mb-8"
    />

    <div class="grid grid-cols-2 gap-x-2">
      <app-button preset = "full bluealt2 t0" (click)="post()"> <b> добавить </b></app-button>
      <app-button preset = "full bluealt2 t0" (click)="closeMenu()"> <b> отмена </b></app-button>
    </div>
  }
  @else {
    <app-button preset="full t2 pink" (click)="openMenu()">+</app-button>
  }
