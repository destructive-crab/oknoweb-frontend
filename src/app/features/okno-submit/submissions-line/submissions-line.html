@if (submissions.length > 0) {
  <div class="overflow-hidden whitespace-nowrap" (mouseenter)="marqueePaused = true" (mouseleave)="marqueePaused = false">
    <div class="inline-flex gap-3 marquee-content" [class.marquee-paused]="marqueePaused">
      @for (sub of submissions; track sub.id) {
        <a [routerLink]="'/submissions/' + sub.id" class="inline-block">
          <span class="inline-block font-main font-bold text-xl md:text-2xl text-blue-700 bg-white border-4 border-b-8 border-r-8 border-blue-700 hover:bg-blue-700 hover:text-white px-4 py-2 cursor-pointer whitespace-nowrap transition-colors">
            {{ sub.name }}
          </span>
        </a>
      }
      @for (sub of submissions; track sub.id) {
        <a [routerLink]="'/submissions/' + sub.id" class="inline-block">
          <span class="inline-block font-main font-bold text-xl md:text-2xl text-blue-700 bg-white border-4 border-b-8 border-r-8 border-blue-700 hover:bg-blue-700 hover:text-white px-4 py-2 cursor-pointer whitespace-nowrap transition-colors">
             {{ sub.name }}
          </span>
        </a>
      }
    </div>
  </div>
  <br />
}
