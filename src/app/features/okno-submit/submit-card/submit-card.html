<div class="block justify-center mbe-2 mbs-2 md:mbe-5 md:mbs-5">
  <div class="border-10 3xl:border-20 border-blue-700 border-double bg-white w-full px-4 sm:px-6 lg:px-8">

    <div class="font-main text-[44px] leading-8 text-center md:text-4xl text-[#000555] mt-5 mb-7">
      <h2><b> {{ this.submitInfo.name }}</b></h2>
    </div>

    <div class="font-main leading-7 text-2xl text-balance md:text-center md:text-2xl text-[#000555] break-all mb-5">
      <h3 class="break-normal"><b> {{ this.submitInfo.additionalInfo }} </b></h3>
    </div>

    @if(submitInfo.rating > -1) {
      <div class="font-main leading-7 text-2xl text-balance text-center md:text-2xl text-[#000555] break-all mb-5">
        <h3 class="break-normal"><b> {{ this.submitInfo.rating }} </b></h3>
      </div>
    }

    <div
      class="font-main leading-7 text-2xl md:text-center md:text-2xl text-[#000555] outline-2 outline-pink-400 break-all"
    >
      <a href="{{this.submitInfo.link}}" target="_blank"><b> {{ this.submitInfo.link }} </b></a>
    </div>

    @if (this.submitInfo.status == 'reviewed') {
    <br />
    <div class="flex justify-stretch w-full">
      <app-button preset="full blue t1" (onClick)="openReview()" class="w-full text-center">
        смотреть обзор
      </app-button>
    </div>
    }

    <div class="text-center mt-4 mb-4 font-main font-bold">{{this.submitInfo.date}}</div>

    <div class="p-4 flex flex-wrap justify-center w-full">
      @for (tag of submitInfo.tags; track $index)
      {
        <div class=" bg-blue-600 text-white font-main text-sm md:text-xl px-2 mx-1 mb-2 font-bold border-3 border-blue-600">
          {{tag}}
        </div>
      }
    </div>

  </div>
</div>
